[package]
name = "student-athlete-burnout-simulator"
version = "0.1.0"
description = "A desktop simulator for a differential equations burnout model."
authors = ["Student"]
edition = "2021"

[lib]
name = "student_athlete_burnout_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.9.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
